<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>[[TITLE]]</title>
    <!--[if mso]>
    <style>
        table {
            border-collapse: collapse;
            border-spacing: 0;
            border: none;
            margin: 0;
        }

        div, td {
            padding: 0;
        }

        div {
            margin: 0 !important;
        }
    </style>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>

        table {
            font-family: Arial, Helvetica, sans-serif;
        }

        #bodycontent {
            padding: 15px;
        }

        #bodycontent p {
            margin: 0 0 16px 0;
            font-size: 16px;
            line-height: 24px;
            color: #333333;
        }

        #bodycontent strong,
        #bodycontent b {
            font-weight: bold;
            color: inherit;
        }

        #bodycontent em,
        #bodycontent i {
            font-style: italic;
            color: inherit;
        }

        #bodycontent h1,
        #bodycontent h2,
        #bodycontent h3,
        #bodycontent h4 {
            margin: 0 0 16px 0;
            font-weight: bold;
            color: #1a1a1a;
            line-height: 1.3;
        }

        #bodycontent h1 {
            font-size: 26px;
        }

        #bodycontent h2 {
            font-size: 20px;
        }

        #bodycontent h3 {
            font-size: 18px;
        }

        #bodycontent h4 {
            font-size: 16px;
        }

        #bodycontent ul,
        #bodycontent ol {
            margin: 0 0 16px 0;
            padding: 0 0 0 24px;
            font-size: 16px;
            line-height: 24px;
            color: #333333;
        }

        #bodycontent li {
            margin: 0 0 8px 0;
        }

        #bodycontent hr {
            border: none;
            border-top: 1px solid #eaeaea;
            margin: 24px 0;
        }

        #bodycontent blockquote {
            margin: 0 0 16px 0;
            padding: 4px 0 4px 16px;
            border-left: 3px solid #d9d9d9;
            color: #5a5a5a;
            font-style: italic;
        }

        #bodycontent img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* a plain data table, e.g. for listing submitted form fields as
           label/value pairs in a notification email */
        #bodycontent table.ff-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 0 16px 0;
            font-size: 15px;
            line-height: 22px;
            color: #333333;
        }

        #bodycontent table.ff-table th,
        #bodycontent table.ff-table td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #eaeaea;
            vertical-align: top;
        }

        #bodycontent table.ff-table th {
            font-weight: bold;
            color: #1a1a1a;
            white-space: nowrap;
        }

        #bodycontent small {
            font-size: 13px;
            color: #6a6a6a;
        }

        #bodycontent code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            background: #f0f0f0;
            color: #1a1a1a;
            padding: 2px 5px;
            border-radius: 3px;
        }

        #bodycontent a {
            color: #2b6cb0;
            text-decoration: underline;
        }

        #bodycontent a.button {
            display: inline-block;
            text-decoration: none;
            background: #2b6cb0;
            color: #ffffff !important;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
        }

        #bodycontent a.button:hover {
            background: #1a4e8a;
        }

        #bodycontent .code {
            display: inline-block;
            font-weight: bold;
            font-size: 16px;
            padding: 10px 5px;
            background: #f0f0f0;
            color: #1a1a1a;
            border-radius: 3px;
        }

        /* mobile: reduce outer padding a bit so content doesn't feel
           cramped against the viewport edges on small screens */
        @media only screen and (max-width: 600px) {
            .ff-container {
                width: 100% !important;
            }

            #bodycontent {
                padding: 20px 16px !important;
            }

            .ff-header,
            .ff-footer {
                padding-left: 16px !important;
                padding-right: 16px !important;
            }
        }

    </style>
</head>
<body style="margin:0;padding:0;word-spacing:normal;background-color:#f4f4f5;">
<div role="article" aria-roledescription="email"
     style="text-size-adjust:100%;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;background-color:#f4f4f5;">
    <!-- Email body starts here -->
    <table role="presentation" style="width:100%;border:none;border-spacing:0;">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <!--[if mso]>
                <table role="presentation" align="center" style="width:600px;">
                    <tr>
                        <td>
                <![endif]-->

                <table role="presentation" class="ff-container" width="100%"
                       style="width:100%;max-width:600px;border:none;border-spacing:0;text-align:left;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#333333;background-color:#ffffff;border-radius:6px;overflow:hidden;">

                    <!-- Header starts here -->
                    <tr>
                        <td class="ff-header"
                            style="padding:28px 30px;text-align:left;border-bottom:1px solid #eaeaea;">
                            <a href="[[DOMAINVALUE]]"
                               style="text-decoration:none;color:#1a1a1a;font-size:20px;font-weight:bold;">[[DOMAINVALUE]]</a>
                        </td>
                    </tr>
                    <!-- Header ends here -->

                    <!-- Main body starts here -->
                    <tr id="bodycontent">
                        <td style="padding:30px;">
                            <table role="presentation" width="100%" style="width:100%;border:none;border-spacing:0;">
                                <tr id="subject">
                                    <td style="padding:0 0 15px 0;">
                                        <h2 style="margin:0;font-size:20px;line-height:28px;color:#1a1a1a;">[[SUBJECT]]</h2>
                                    </td>
                                </tr>
                                <tr id="text">
                                    <td style="padding:0;">[[BODY]]</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Main body ends here -->

                    <!-- Footer starts here -->
                    <tr>
                        <td class="ff-footer"
                            style="padding:20px 30px;text-align:left;font-size:12px;line-height:18px;color:#8a8a8a;background-color:#fafafa;border-top:1px solid #eaeaea;">
                            <a href="[[DOMAINVALUE]]" style="color:#8a8a8a;text-decoration:underline;">[[DOMAINVALUE]]</a>
                        </td>
                    </tr>
                    <!-- Footer ends here -->

                </table>

                <!--[if mso]>
                </td>
                </tr>
                </table>
                <![endif]-->
            </td>
        </tr>
    </table>
    <!-- Email body ends here -->
</div>
</body>
</html>
